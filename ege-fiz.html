<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трек: ЕГЭ математика (профиль) — часть 1, задания 1–14</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1d2130; --border:#2a2f42;
  --text:#e8eaf2; --muted:#9aa0b5; --accent:#4f8cff; --accent2:#8b5cf6;
  --green:#34c77b; --red:#ef5b6e; --yellow:#f0b429; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
header{padding:26px 0 10px}
h1{font-size:21px;font-weight:600}
h3{font-size:17px;margin-bottom:8px;font-weight:600}
.sub{color:var(--muted);margin-top:6px;font-size:14px}
.badge-demo{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(240,180,41,.15);color:var(--yellow);margin-top:8px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.mini-badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--border)}
.mini-badge b{color:var(--green)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10}
.tab{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:99px;cursor:pointer;font-size:14px;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view{display:none}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin:12px 0}
.muted{color:var(--muted);font-size:13px}
ul,ol{margin:8px 0 8px 20px}
li{margin:5px 0}
b{color:#fff}
.callout{border-left:3px solid var(--accent);background:var(--panel2);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14px}
.callout.gold{border-color:var(--yellow)}
.callout.green{border-color:var(--green)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
th,td{padding:7px 8px;border-bottom:1px solid var(--border)}
.q{margin:14px 0;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.qq{font-weight:600;margin-bottom:10px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;margin:6px 0;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(79,140,255,.12)}
.opt.correct{border-color:var(--green);background:rgba(52,199,123,.15)}
.opt.wrong{border-color:var(--red);background:rgba(239,91,110,.15)}
.expl{display:none;margin-top:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px}
.expl.show{display:block}
.score{display:none;margin-top:12px;padding:12px;border-radius:10px;font-weight:600}
.score.show{display:block}
.score.pass{background:rgba(52,199,123,.15);color:var(--green)}
.score.fail{background:rgba(239,91,110,.15);color:var(--red)}
button.act{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;margin:4px 6px 4px 0}
button.act:hover{filter:brightness(1.12)}
button.act.sec{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.streak{font-size:14px;margin-top:8px}
.streak b{color:var(--green)}
.trainer-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.trainer-ctl label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:14px}
.step{margin:6px 0;padding-left:12px;border-left:2px solid var(--border)}
.formula{background:var(--panel2);border-radius:8px;padding:8px 12px;font-family:Consolas,monospace;font-size:14px;margin:6px 0;display:inline-block}
.err td{color:var(--red)}
.big-res{font-size:24px;font-weight:600;margin:8px 0}
.code-input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:10px;font-size:14px;width:240px;margin:6px 6px 6px 0}
.pay-note{margin-top:8px;font-size:13px}
.bar{background:var(--panel2);border-radius:99px;height:10px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.ok{background:var(--green)}
.bar i.warn{background:var(--yellow)}
.bar i.bad{background:var(--red)}
.rank{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:rgba(139,92,246,.15);color:var(--accent2)}
.golden{border-color:var(--yellow)!important;background:rgba(240,180,41,.08)!important}
textarea{width:100%;min-height:150px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:13px;font-family:Consolas,monospace}
svg.geom{background:#e8eaf2;border-radius:8px;margin:8px 0}
.timer{font-size:22px;font-weight:600;font-family:Consolas,monospace}
.timer.warn{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🎓 Трек «ЕГЭ физика» — часть 1: формулы</h1>
  <div class="sub">Диагностика → разбор → тренажёр с новыми числами → мини-экзамен с готовностью в %.</div>
  <div class="top">
    <span class="badge-demo">Задания — собственные аналоги типов открытого банка ФИПИ (не копии КИМов)</span>
    <span class="mini-badge">🔥 Серия дней: <b id="hb-days">–</b></span>
    <span class="mini-badge">🎯 Задача дня: <b id="hb-quest">–</b></span>
    <span class="mini-badge" id="hb-rank">🏅 –</span>
    <a class="mini-badge" style="text-decoration:none" href="index.html">← Каталог предметов</a>
  </div>
</header>
<div class="tabs">
  <button class="tab active" data-view="diag">🧪 Диагностика</button>
  <button class="tab" data-view="theory">📘 Разбор</button>
  <button class="tab" data-view="trainer">♾️ Тренажёр</button>
  <button class="tab" data-view="exam">🎓 Мини-экзамен</button>
  <button class="tab" data-view="progress">📊 Прогресс</button>
</div>

<div class="view active" id="view-diag"></div>
<div class="view" id="view-theory"></div>
<div class="view" id="view-trainer"></div>
<div class="view" id="view-exam"></div>
<div class="view" id="view-progress"></div>
</div>

<script>
/* =====================================================================
   ФЕКО ЕГЭ профмат — движок трека. Коды/чексумма СИНХРОНИЗИРОВАТЬ с
   index.html и ботом-воркером. Генераторы чистые: gen(rng).
===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/"/g,'&quot;');
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
let QRNG=null; // подменяется только для «задач дня» (детерминизм: одинаковые у всех)
const rnd=arr=>arr[Math.floor((QRNG||Math.random)()*arr.length)];
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const todayStr=()=>new Date().toISOString().slice(0,10);

/* ====== ДОСТУП (как в каталоге) ====== */
const MY_PREFIX='FIZ'; // этот трек
const ALPHABET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const LEGACY=['EXAM-490-DEMO','FECO-EXAM-490'];
const SUBJECT_PREFIX=['MAT','BAS','RUS','INF','FIZ','OGM'];
const DEMO_TRAINER=3;
let demoLeft=DEMO_TRAINER;
try{demoLeft=DEMO_TRAINER-(+(localStorage.getItem('exam-demo-used')||0));}catch(e){}
function codeChecksum(body){let s=0;for(const ch of body){const i=ALPHABET.indexOf(ch);if(i<0)return -1;s+=i;}return s%31;}
function parseCode(code){
  const c=((code||'')+'').trim().toUpperCase().replace(/\s+/g,'');
  const m=c.match(/^([A-Z]{2,5})-([A-Z0-9]{8})$/);if(!m)return null;
  const body=m[2].slice(0,7),chk=m[2][7];
  if(ALPHABET.indexOf(chk)<0)return null;
  if(codeChecksum(body)!==ALPHABET.indexOf(chk))return null;
  return {prefix:m[1],body};
}
function getAccess(){try{return JSON.parse(localStorage.getItem('exam-access')||'{}');}catch(e){return {};}}
function setAccess(a){try{localStorage.setItem('exam-access',JSON.stringify(a));}catch(e){}}
function hasAccess(){
  const a=getAccess();
  try{if(localStorage.getItem('exam-unlocked')==='1')return true;}catch(e){}
  return a.all===true||((a.allUntil||0)>Date.now())||!!(a.subjects&&a.subjects[MY_PREFIX]);
}
function payBlock(key){
  return `<div class="card">
    <h3>🔒 Полный доступ к треку — 990 ₽</h3>
    <div class="muted">Разово, навсегда — дешевле одного занятия с репетитором (1 500–2 500 ₽/час). Тренажёр с бесконечными вариантами, 8 формульных типов физики ч.1, мини-экзамен с верифицированной готовностью в %.</div>
    <div style="margin:12px 0"><button class="act" onclick="payClick()">Купить за 990 ₽</button></div>
    <div><span class="muted">Уже оплатили? Введите код из письма/бота:</span><br>
      <input type="text" id="unlock-code-${key}" class="code-input" placeholder="XXXX-XXXXXXXX">
      <button class="act sec" onclick="unlockCheck('${key}')">Разблокировать</button></div>
    <div id="unlock-msg-${key}" class="pay-note"></div>
    <div class="callout gold" style="margin-top:12px">💡 Выгоднее подписка: <b>490 ₽/мес — все предметы</b>. Диагностика и разбор бесплатны всегда.</div>
  </div>`;
}
window.payClick=function(){
  const msg=document.querySelector('.view.active .pay-note');
  if(msg)msg.innerHTML='<span style="color:var(--yellow)">Оплата — в Telegram-боте @fecoexam_bot (⭐ Stars) или ручным кодом после перевода. Для проверки используйте тестовый код EXAM-490-DEMO.</span>';
};
window.unlockCheck=function(key){
  const inp=document.getElementById('unlock-code-'+key);
  const msg=document.getElementById('unlock-msg-'+key);
  const c=((inp&&inp.value)||'').trim().toUpperCase();
  if(LEGACY.includes(c)){
    const a=getAccess();a.all=true;setAccess(a);
    msg.innerHTML='<span style="color:var(--green)">✓ Полный доступ активирован — обновляю страницы…</span>';
    renderTrainer();renderExam();
  }else{
    const p=parseCode(c);
    if(!p){msg.innerHTML='<span style="color:var(--red)">✗ Код не подошёл. Проверьте написание или оплатите доступ.</span>';}
    else if(p.prefix==='ALL'){
      const a=getAccess();a.allUntil=Date.now()+30*864e5;setAccess(a);
      msg.innerHTML='<span style="color:var(--green)">✓ Все предметы открыты на 30 дней.</span>';
      renderTrainer();renderExam();
    }else if(p.prefix===MY_PREFIX){
      const a=getAccess();a.subjects=a.subjects||{};a.subjects[MY_PREFIX]=1;setAccess(a);
      msg.innerHTML='<span style="color:var(--green)">✓ Трек открыт навсегда.</span>';
      renderTrainer();renderExam();
    }else if(SUBJECT_PREFIX.includes(p.prefix)){
      msg.innerHTML='<span style="color:var(--yellow)">Код от другого предмета ('+p.prefix+'). Для этого трека нужен код MAT-… или ALL-…</span>';
    }else{msg.innerHTML='<span style="color:var(--red)">✗ Неизвестный код. Напишите нам — проверим.</span>';}
  }
};

/* ====== ГЕОМЕТРИЧЕСКИЙ SVG ====== */
function svgTriangle(a,b,c){
  const k=Math.min(180/b,110/a,1.6);
  const bw=b*k,bh=a*k;
  return `<svg class="geom" width="${Math.round(bw+30)}" height="${Math.round(bh+30)}" viewBox="0 0 ${Math.round(bw+30)} ${Math.round(bh+30)}">
  <polygon points="20,${Math.round(20+bh)} 20,20 ${Math.round(20+bw)},${Math.round(20+bh)}" fill="none" stroke="#1d2130" stroke-width="2.5"/>
  <rect x="20" y="${Math.round(20+bh-12)}" width="12" height="12" fill="none" stroke="#1d2130" stroke-width="1.5"/>
  <text x="10" y="${Math.round(20+bh/2)}" font-size="13" fill="#333">${a}</text>
  <text x="${Math.round(20+bw/2)}" y="${Math.round(30+bh)}" font-size="13" fill="#333">${b}</text>
  <text x="${Math.round(26+bw/2)}" y="${Math.round(20+bh/2)}" font-size="13" fill="#333">${c}</text>
  <text x="24" y="${Math.round(14+bh)}" font-size="10" fill="#666">прямой угол</text>
  </svg>`;
}
function svgDerGraph(k){ // график производной с k пересечениями нуля
  const vals={2:[2,-1,1],3:[2,-1,3,-2],4:[2,-1,3,-2,2]}[k];
  const pts=[];const n=11;
  for(let i=0;i<n;i++){
    const t=i*(vals.length-1)/(n-1);
    const j=Math.min(Math.floor(t),vals.length-2);
    const y=vals[j]+(vals[j+1]-vals[j])*(t-j);
    pts.push(`${20+i*26},${Math.round(70-y*16)}`);
  }
  return `<svg class="geom" width="300" height="140" viewBox="0 0 300 140">
  <line x1="10" y1="70" x2="290" y2="70" stroke="#999" stroke-width="1"/>
  <line x1="150" y1="10" x2="150" y2="130" stroke="#999" stroke-width="1"/>
  <polyline points="${pts.join(' ')}" fill="none" stroke="#4f8cff" stroke-width="3"/>
  <text x="292" y="74" font-size="11" fill="#333">x</text>
  <text x="154" y="16" font-size="11" fill="#333">f′</text>
  </svg>`;
}

function mk(rng,fun){return fun?fun(rng||Math.random):null;}
/* ====== ТИПЫ ЕГЭ ФИЗИКА (СИНХРОНИЗИРОВАТЬ с воркером бота) ====== */
const TYPES=[
 {id:'f1',name:'Равномерное движение',w:1,trap:'перепутал s и t',gist:'v = s/t; t = s/v; s = v·t',gen:r=>mk(r,()=>{
   const v=rnd([2,5,10,20,25,50]),t=rnd([3,4,5,6,10,12]);
   const s=v*t;
   const ask=r()<0.5?'t':'v';
   if(ask==='t'){
     const ans=t;
     const cand=[ans,s,s*v,v/s,s-t];
     const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
     return {q:`Велосипедист проехал ${s} м со скоростью ${v} м/с. Сколько секунд он ехал?`,
       o:uniq.map(String),c:uniq.indexOf(ans),
       e:`t = s/v = ${s}/${v} = ${ans} с. Ловушка ${s} — дал путь вместо времени.`};
   }
   const ans=v;
   const cand=[ans,s/t*2,s*t,s-t,s+t];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Тело прошло ${s} м за ${t} с. Найдите скорость (в м/с).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`v = s/t = ${s}/${t} = ${ans} м/с. Ловушка ${s*t} — умножил вместо деления.`};})},
 {id:'f2',name:'Ускорение',w:1,trap:'не разделил изменение скорости на время',gist:'a = (v₂ − v₁)/t',gen:r=>mk(r,()=>{
   const v1=rnd([0,2,4,5,10]),dv=rnd([2,4,6,8,10]),t=rnd([2,4,5,10]);
   const v2=v1+dv;
   const ans=dv/t;
   if(dv%t!==0)return mk(r);
   const cand=[ans,dv,dv*t,v2/t,v1/t];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Скорость тела выросла с ${v1} до ${v2} м/с за ${t} с. Найдите ускорение (в м/с²).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`a = (v₂−v₁)/t = (${v2}−${v1})/${t} = ${dv}/${t} = ${ans} м/с². Ловушка ${dv} — деление забыл, ${v2/t} — взял конечную скорость вместо изменения.`};})},
 {id:'f3',name:'Второй закон Ньютона',w:1,trap:'умножил вместо деления',gist:'F = m·a; a = F/m',gen:r=>mk(r,()=>{
   const m=rnd([2,4,5,8,10]),a=rnd([2,3,4,5,6]);
   const F=m*a;
   const ask=r()<0.5?'a':'F';
   if(ask==='a'){
     const ans=a;
     const cand=[ans,F,F/m/2,m/F,F*m];
     const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
     return {q:`Сила ${F} Н действует на тело массой ${m} кг. Найдите ускорение (в м/с²).`,
       o:uniq.map(String),c:uniq.indexOf(ans),
       e:`a = F/m = ${F}/${m} = ${ans} м/с². Ловушка ${F*m} — умножил вместо деления.`};
   }
   const ans=F;
   const cand=[ans,m/a,F/m,a/m,F+a];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Тело массой ${m} кг движется с ускорением ${a} м/с². Найдите равнодействующую силу (в Н).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`F = m·a = ${m}·${a} = ${ans} Н. Ловушка ${m/a} — деление вместо умножения.`};})},
 {id:'f4',name:'Импульс',w:1,trap:'сложил массу и скорость',gist:'p = m·v',gen:r=>mk(r,()=>{
   const m=rnd([1,2,4,5,10]),v=rnd([2,3,4,5,10,20]);
   const ans=m*v;
   const cand=[ans,m+v,m/v,ans*2,ans/m];
   const uniq=[...new Set(cand)].slice(0,4);
   return {q:`Тело массой ${m} кг движется со скоростью ${v} м/с. Найдите импульс (в кг·м/с).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`p = m·v = ${m}·${v} = ${ans} кг·м/с. Ловушка ${m+v} — сложил вместо умножения.`};})},
 {id:'f5',name:'Давление',w:1,trap:'забыл про площадь опоры',gist:'p = F/S; S — площадь опоры в м²',gen:r=>mk(r,()=>{
   const p=rnd([200,400,500,800,1000,2000]),S=rnd([0.2,0.25,0.4,0.5,2,4]);
   const F=p*S;
   if(F!==Math.round(F))return mk(r);
   const ask=r()<0.5?'p':'F';
   if(ask==='p'){
     const ans=p;
     const cand=[ans,F,F/S/2,S/F,F*S];
     const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
     return {q:`Сила ${fmt(F)} Н действует на опору площадью ${S} м². Найдите давление (в Па).`,
       o:uniq.map(String),c:uniq.indexOf(ans),
       e:`p = F/S = ${fmt(F)}/${S} = ${fmt(ans)} Па. Ловушка ${fmt(F*S)} — умножил вместо деления.`};
   }
   const ans=F;
   const cand=[ans,p/S,p*S,ans/2,ans*10];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Давление на опору ${fmt(p)} Па, площадь опоры ${S} м². Найдите силу (в Н).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`F = p·S = ${fmt(p)}·${S} = ${fmt(ans)} Н. Ловушка ${fmt(p/S)} — деление вместо умножения.`};})},
 {id:'f6',name:'Количество теплоты',w:1,trap:'забыл ΔT (использовал конечную температуру)',gist:'Q = c·m·ΔT; ΔT = t₂ − t₁',gen:r=>mk(r,()=>{
   const c=500,m=rnd([1,2,4,5]),dT=rnd([10,20,30,40,50]);
   const t1=rnd([10,20,30]);
   const t2=t1+dT;
   const ans=c*m*dT;
   const cand=[ans,c*m*t2,c*m+t2,c*dT,ans/10];
   const uniq=[...new Set(cand)].slice(0,4);
   return {q:`Стальную деталь (c = 500 Дж/(кг·°C)) массой ${m} кг нагрели с ${t1} °C до ${t2} °C.
Сколько теплоты передано детали (в Дж)?`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`ΔT = ${t2}−${t1} = ${dT} °C; Q = c·m·ΔT = 500·${m}·${dT} = ${fmt(ans)} Дж. Ловушка ${fmt(c*m*t2)} — взял конечную температуру вместо ΔT.`};})},
 {id:'f7',name:'Закон Ома',w:1,trap:'перевернул дробь',gist:'I = U/R; R = U/I; U = I·R',gen:r=>mk(r,()=>{
   const R=rnd([2,4,5,8,10,20]),I=rnd([1,2,3,4,5]);
   const U=R*I;
   const ask=r()<0.5?'I':'R';
   if(ask==='I'){
     const ans=I;
     const cand=[ans,U,U/R/2,R/U,U*R,ans+1,ans+2];
     const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
     return {q:`Напряжение на резисторе ${U} В, сопротивление ${R} Ом. Найдите силу тока (в А).`,
       o:uniq.map(String),c:uniq.indexOf(ans),
       e:`I = U/R = ${U}/${R} = ${ans} А. Ловушка ${R/U} — перевернул дробь.`};
   }
   const ans=R;
   const cand=[ans,U/I,U*I,ans*2,I/U,ans+1,ans/2];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Напряжение ${U} В, сила тока ${I} А. Найдите сопротивление (в Ом).`,
     o:uniq.map(String),c:uniq.indexOf(ans),
     e:`R = U/I = ${U}/${I} = ${ans} Ом. Ловушка ${U*I} — умножил вместо деления.`};})},
 {id:'f8',name:'Мощность',w:1,trap:'перепутал A/t и A·t',gist:'P = A/t = A/t (джоули в секунду)',gen:r=>mk(r,()=>{
   const t=rnd([2,4,5,10,20]),P=rnd([10,20,25,50,100,200]);
   const A=P*t;
   const ask=r()<0.5?'P':'A';
   if(ask==='P'){
     const ans=P;
     const cand=[ans,A,A*t,A/2,t/A];
     const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
     return {q:`Совершена работа ${fmt(A)} Дж за ${t} с. Найдите мощность (в Вт).`,
       o:uniq.map(String),c:uniq.indexOf(ans),
       e:`P = A/t = ${fmt(A)}/${t} = ${fmt(ans)} Вт. Ловушка ${fmt(A*t)} — умножил вместо деления.`};
   }
   const ans=A;
   const cand=[ans,P/t,P+t,ans/2,ans*2];
   const uniq=[...new Set(cand)].filter(x=>x>0).slice(0,4);
   return {q:`Двигатель мощностью ${fmt(P)} Вт работал ${t} с. Найдите совершённую работу (в Дж).`,
     o:uniq.map(String),c:uniq.indexOf(ans),

];


/* ====== БАНКИ ВОПРОСОВ (для знаниевых предметов) ====== */
function pick(r,arr){return arr[Math.floor(r()*arr.length)];}
function shuf(r,arr){
  const a=arr.map((v,i)=>[v,i]);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function totalOk(){let n=0;for(const t in stats)n+=stats[t].ok;return n;}
function rank(){const n=totalOk();let r=RANKS[0][1];for(const [m,name] of RANKS)if(n>=m)r=name;return r;}
function rankNext(){const n=totalOk();for(const [m,name] of RANKS)if(n<m)return {name,need:m-n};return null;}
function unlockBadge(id,name){
  if(badges.includes(id))return;
  badges.push(id);save(K.badges,badges);
  goldenMsg+=` 🏅 Новый бейдж: <b>${name}</b>!`;
}
function touchDays(){
  const today=todayStr();
  if(days.last===today)return;
  const yest=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(days.last===yest){days.streak++;}
  else if(days.last&&days.freezes>0){days.freezes--;goldenMsg+=' ❄️ Заморозка серии использована — серия сохранена!';}
  else{days.streak=1;}
  days.last=today;
  if(days.streak>=5)unlockBadge('streak5','Пять дней подряд 🔥');
  if(days.streak>=10)unlockBadge('streak10','Десять дней подряд 🔥🔥');
  save(K.days,days);
}
function questNew(){
  const today=todayStr();
  if(quest.date!==today){quest={date:today,done:0};save(K.quest,quest);}
  return quest;
}
function questTask(i){ // задачи дня: seeded PRNG от даты — одинаковые у всех
  const base=hashStr('feco-exam-quest-'+todayStr()+'-'+i);
  for(let k=0;k<12;k++){
    QRNG=mulberry32(base+k*7919);
    const t=TYPES[(base+k)%TYPES.length].gen(QRNG);
    QRNG=null;
    if(t&&validTask(t))return t; // svg/невалидные пропускаются детерминированно
  }
  QRNG=null;
  return TYPES[0].gen(Math.random);
}
function record(typeId,ok,ms){
  const s=stats[typeId]||(stats[typeId]={n:0,ok:0,times:[],wrong:0});
  s.n++;if(ok){s.ok++;s.times.push(Math.round(ms));if(s.times.length>50)s.times.shift();}
  else s.wrong++;
  save(K.stats,stats);
  const q=questNew();
  if(ok&&q.done<3){q.done++;save(K.quest,quest);
    if(q.done===3)unlockBadge('quest1','Задача дня выполнена 🎯');
    if(q.done===3)goldenMsg+=' ✅ Квест дня закрыт — все 3 задачи!';
  }
  touchDays();
  if(totalOk()>=15)unlockBadge('rank2','Ранг «Решала» 🏅');
  if(totalOk()>=50)unlockBadge('rank3','Ранг «Снайпер» 🏅');
  if(totalOk()>=150)unlockBadge('rank4','Ранг «Мастер экзамена» 🏅');
}

function checkAll(container,qs){
  let right=0;let totalMs=0;
  qs.forEach((q,i)=>{
    const el=document.querySelectorAll(container+' .q')[i];
    el.classList.add('locked');
    const c=+el.dataset.c,opts=el.querySelectorAll('.opt'),sel=el.querySelector('.opt.sel');

function validTask(t){
  return t&&t.o&&t.o.length>=2&&new Set(t.o).size===t.o.length&&t.c>=0&&t.c<t.o.length&&t.q&&t.e;
}
function genSafe(type,rng){
  for(let i=0;i<30;i++){
    const t=TYPES.find(x=>x.id===type).gen(rng||Math.random);
    if(validTask(t))return t;
  }
  return TYPES[0].gen(Math.random);
}

    const m=Math.floor(examTimeLeft/60),s=examTimeLeft%60;
    const el=$('#exam-clock');
    el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
    el.className='timer'+(examTimeLeft<60?' warn':'');
    examTimeLeft--;
  };
  tick();examTimer=setInterval(tick,1000);
}
window.runExam=function(auto){
  clearInterval(examTimer);
  const {right,avgMs}=checkAll('#quiz-exam',examTasks);
  const verified=examTimed&&avgMs>=2000;
  const pass=right>=4;
  scoreMsg($('#score-exam'),right,5,4,pass,(verified?'⏱ Верифицированный замер (с таймером, осмысленное время). ':'Свободный режим — для готовности считается с меньшим весом. ')+(pass?'Тема движется к закрытию!':'Нужно 4 из 5 — разборы выше и Тренажёр помогут.'));
  const weighted=examTasks.reduce((a,q)=>a+q._w,0);
  const got=examTasks.reduce((a,q,i)=>{
    const el=document.querySelectorAll('#quiz-exam .q')[i];
    const c=+el.dataset.c,opts=el.querySelectorAll('.opt'),sel=el.querySelector('.opt.sel');
    return a+(sel&&+[...opts].indexOf(sel)===c?q._w:0);
  },0);
  const pct=Math.round(got/weighted*100);
  $('#exam-res').textContent=`Готовность по этому варианту: ${pct}%${verified?' ⏱':''}${auto?' (время вышло)':''}`;
  const prev=examBest;
  const entry={pct,verified,date:todayStr()};
  if(!prev||pct>prev.pct||(pct===prev.pct&&verified&&!prev.verified))examBest=entry;
  save(K.exam,examBest);
  if(pass&&verified)unlockBadge('exam80','Мини-экзамен с таймером сдан 🎓');
};

/* ====== ПРОГРЕСС + ВАЛИДАЦИЯ + ОТЧЁТ ====== */
function confWord(totalN){return totalN>=30?'высокая':totalN>=15?'средняя':'низкая';}
function readiness(){
  let wSum=0,got=0,used=0;
  TYPES.forEach(t=>{
    const s=stats[t.id];
    if(s&&s.n>=3){wSum+=t.w;got+=t.w*(s.ok/s.n);used++;}
  });
  return wSum>0?{pct:Math.round(got/wSum*100),used}:{pct:null,used:0};
}
function renderProgress(){
  const r=readiness();
  const conf=confWord(TYPES.reduce((a,t)=>a+((stats[t.id]&&stats[t.id].n)||0),0));
  const rk=rankNext();
  $('#view-progress').innerHTML=`
  <div class="card">
    <h3>📊 Готовность к физике ч.1 (взвешенная, валидированная)</h3>
    ${r.pct!==null?`<div class="big-res">${r.pct}% <span class="rank">${rank()}</span></div>
    <div class="muted">Уверенность оценки: <b>${conf}</b> (по числу решённых задач). Готовность = взвешенная решаемость типов по их весу на экзамене. Это вероятность решить тип, а не гарантированный балл. Экзамен-режим ⏱ весит больше свободного режима.</div>
    ${examBest?`<div class="callout ${examBest.verified?'green':''}">Лучший мини-экзамен: <b>${examBest.pct}%</b>${examBest.verified?' ⏱ верифицированный':' (свободный режим)'} — ${examBest.date}</div>`:''}
    ${rk?`<div class="muted" style="margin-top:6px">До ранга «${rk.name}»: ещё ${rk.need} верных задач.</div>`:''}
    <div class="muted" style="margin-top:6px">Бейджи: ${badges.length?badges.length+' шт. — в тренажёре и на экзамене':'пока нет — они появятся за серии, квесты и экзамены'}</div>`
    :`<div class="muted">Данных пока мало: решите хотя бы 3 задачи в Тренажёре (любых типов) — и здесь появится взвешенная готовность.</div>`}
  </div>
  <div class="card">
    <h3>По типам заданий</h3>
    <table>
      <tr><th>Тип</th><th>Решено</th><th>Верно</th><th>Решаемость</th><th>Уверенность</th></tr>
      ${TYPES.map(t=>{
        const s=stats[t.id];
        if(!s||s.n===0)return `<tr><td>${t.name}</td><td>0</td><td>—</td><td class="muted">не решали</td><td class="muted">—</td></tr>`;
        const pct=Math.round(s.ok/s.n*100);
        const cls=pct>=80?'ok':pct>=60?'warn':'bad';
        const conf=s.n>=15?'высокая':s.n>=5?'средняя':'мало данных';
        const pctCell=s.n>=5?`<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>${pct}%`:'— мало данных';
        return `<tr><td>${t.name}</td><td>${s.n}</td><td>${s.ok}</td><td style="min-width:130px">${pctCell}</td><td>${conf}</td></tr>`;
      }).join('')}
    </table>
    <div class="callout gold">Пороги: <b>&lt;60%</b> — тип не готов, <b>60–80%</b> — зона риска, <b>80%+</b> — тип закрыт. Тренируйте в Тренажёре красные типы — вес красных типов в готовности выше.</div>
  </div>
  <div class="card">
    <h3>💼 Отчёт для репетитора</h3>
    <div class="muted">Скопируйте и отправьте репетитору: карта ловушек, верифицированные данные, уверенность оценки.</div>
    <textarea id="tutor-report" readonly></textarea>
    <button class="act" onclick="copyReport()">Скопировать</button>
    <button class="act sec" onclick="buildReport()">Обновить</button>
  </div>`;
  buildReport();
}
function buildReport(){
  const r=readiness();
  const conf=confWord(TYPES.reduce((a,t)=>a+((stats[t.id]&&stats[t.id].n)||0),0));
  let txt=`ФЕКО ЕГЭ физика — отчёт ученика (${new Date().toLocaleDateString('ru-RU')})\n`;
  txt+=`Ранг: ${rank()} · решено верных: ${totalOk()} · серия дней: ${days.streak} · рекорд сессии: ${best}\n`;
  if(r.pct!==null)txt+=`Взвешенная готовность: ${r.pct}% (уверенность: ${conf}; ${r.used} типов с данными)\n`;
  if(examBest)txt+=`Лучший мини-экзамен: ${examBest.pct}%${examBest.verified?' (⏱ верифицированный, с таймером)':''}\n`;
  txt+=`\nПо типам:\n`;
  TYPES.forEach(t=>{
    const s=stats[t.id];
    if(!s||!s.n)return;
    const pct=Math.round(s.ok/s.n*100);
    const avgT=s.times.length?Math.round(s.times.reduce((a,b)=>a+b,0)/s.times.length):null;
    txt+=`- ${t.name}: ${s.ok}/${s.n} (${pct}%)${avgT?`, среднее время ${avgT/1000} с`:''}${s.n<5?', данных мало':''}${pct<60&&s.n>=3?' ← ЛОВУШКА: '+t.trap:''}\n`;
  });
  txt+=`\nВремя на ответы записывается — отчёт трудно подделать. Пороги: <60% не готов, 60–80% риск, 80%+ закрыт.\n`;
  const ta=document.getElementById('tutor-report');
  if(ta)ta.value=txt;
}
window.copyReport=function(){
  const ta=document.getElementById('tutor-report');
  if(!ta)return;
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});
  alert('Отчёт скопирован — вставьте в сообщение репетитору.');
};

/* ====== ВКЛАДКИ ====== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    t.classList.add('active');
    $('#view-'+t.dataset.view).classList.add('active');
    window.scrollTo(0,0);
    if(t.dataset.view==='progress')renderProgress();
  });
});
renderDiag();renderTheory();renderTrainer();renderExam();headerBadges();
</script>
